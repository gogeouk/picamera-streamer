# Drop-in: run the streamer as its own unprivileged user, not as lee.
# Installed by systemd-files/setup-service-user.sh as
#   /etc/systemd/system/picamera.service.d/user.conf
#
# The streamer is the one thing on this Pi that answers the internet (:8000). As lee
# it ran with passwordless root one sudo away; as picamera it can reach the camera
# (video group) and read its own code, settings and TLS key, and nothing else.
[Service]
User=picamera
Group=picamera
SupplementaryGroups=video
# Belt and braces: no setuid/sudo route to root even if sudoers ever changes.
NoNewPrivileges=yes
ProtectSystem=full
ProtectHome=read-only
PrivateTmp=yes
# A place the service can write: /var/lib/picamera, made and owned by systemd for
# this user. The viewing counts live there, so a restart does not lose the day.
StateDirectory=picamera
